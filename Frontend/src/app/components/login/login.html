<div class="container mt-5">

    <div class="card p-4 shadow">

        <h3 class="text-center">Login</h3>

        <div class="mb-3">

            <label>Username</label>

            <input
                type="username"
                class="form-control"
                [(ngModel)]="username">

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input
                type="password"
                class="form-control"
                [(ngModel)]="password">

        </div>

        <button
            class="btn btn-primary w-100"
            (click)="login()">

            Login

        </button>

    </div>

</div>
