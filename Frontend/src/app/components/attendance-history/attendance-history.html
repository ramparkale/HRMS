<div class="card shadow">
  <div class="card-header">
    <h5>Attendance History</h5>
  </div>

  <div class="card-body">

    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Date</th>
          <th>Check In</th>
          <th>Check Out</th>
          <th>Working Hours</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of attendanceList">
          <td>{{ item.AttendanceDate | date:'dd/MM/yyyy' }}</td>
          <td>{{ item.CheckIn | date:'hh:mm a' }}</td>
          <td>{{ item.CheckOut ? (item.CheckOut | date:'hh:mm a') : '-' }}</td>
          <td>{{ item.WorkingHours }}</td>
          <td>{{ item.Status }}</td>
        </tr>
      </tbody>

    </table>

  

  </div>
</div>
